name: Release Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/release-windows.yml"
      - "scripts/build-windows.ps1"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm.cmd run test:run -- --reporter=dot

      - name: Build and verify Windows package
        shell: pwsh
        run: |
          npm.cmd run dist:win 2>&1 | Tee-Object -FilePath release-build.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $tail = (Get-Content -LiteralPath release-build.log -Tail 40) -join "`n"
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows package build failed::$escaped"
            exit $buildExitCode
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $installer = "release/taiji-office-setup-$version.exe"
          $blockmap = "$installer.blockmap"
          $latest = "release/latest.yml"

          git rev-parse --verify "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Release tag is missing: $tag" }

          foreach ($asset in @($installer, $blockmap, $latest)) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Release asset is missing: $asset" }
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --title "Taiji Office $tag" --generate-notes
          }
          gh release upload $tag $installer $blockmap $latest --repo $env:GITHUB_REPOSITORY --clobber

          $installerHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          "### Taiji Office $tag" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "- Installer: ``$installer``" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "- SHA-256: ``$installerHash``" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
